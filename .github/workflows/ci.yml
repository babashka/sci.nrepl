name: ci

on: [push, pull_request]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          bb: latest
          cli: latest

      - name: Run tests
        run: bb test

      - name: Run ClojureScript tests
        run: bb test:cljs
